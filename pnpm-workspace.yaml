packages:
  - "packages/*"
  - "scripts"
  - "tests/integration"
  - "tests/integration/src-web"

allowBuilds:
  tree-sitter: true
  tree-sitter-gdscript: true
  tree-sitter-godot-resource: true
  vue-demi: false

catalog:
  "@alint-js/cli": ^0.0.38
  "@alint-js/core": ^0.0.38
  "@antfu/eslint-config": ^10.0.0
  "@moeru/eventa": ^1.0.2
  "@types/ini": ^4.1.1
  "@types/node": ^26.6.5
  bumpp: ^12.3.0
  cborg: ^4.5.8
  citty: ^0.2.2
  execa: 9.6.1
  eslint: ^10.13.0
  eslint-plugin-format: ^2.0.1
  ini: ^7.0.0
  tsdown: ^0.23.4
  typescript: ^6.0.3
  typescript-to-gdscript: ^0.1.12
  vite: ^8.3.5
  vitest: 4.1.12
  xsai: ^0.5.0-beta.6

minimumReleaseAgeExclude:
  - tsdown@0.23.4

overrides:
  argparse: 3.0.3
  vitest: 4.1.12
  "@vitest/runner": 4.1.12
  "@vitest/expect": 4.1.12
  "@vitest/mocker": 4.1.12
  "@vitest/pretty-format": 4.1.12
  "@vitest/snapshot": 4.1.12
  "@vitest/spy": 4.1.12
  "@vitest/utils": 4.1.12
