[settings]
lockfile = true
legacy_version_file = false

[plugins]
godot = "https://github.com/LemonNekoGH/vfox-godot.git#dd88823451008524efde019c61e222b8dbbf8f62"

[tools]
godot = "4.7.2-stable_mono"
node = "24.15.0"
python = "3.13.13"
uv = "0.11.7"
java = "temurin-21.0.10+7.0.LTS"
dotnet = "10.0.300"
rust = { version = "1.99.0", components = ["clippy", "rustfmt"] }
ktlint = "1.8.0"
swiftlint = { version = "0.62.2", os = ["macos", "linux"] }
pnpm = "12"

[tasks.build]
description = "Build all workspace packages"
run = "pnpm run build"

[tasks."build:addon-pack"]
description = "Build native artifacts and package the Godot addon"
depends = ["build:native-artifacts"]
run = "./scripts/run-build-task.js packAddon"

[tasks."build:android-aar"]
description = "Build Android AAR artifacts"
run = "./scripts/run-build-task.js buildAndroidAar"

[tasks."build:dotnet"]
description = "Build .NET projects"
run = "dotnet build GdKirie.slnx --configuration Release"

[tasks."build:integration-web"]
description = "Build integration web assets"
run = "pnpm -F @gd-kirie/integration-web run build"

[tasks."build:ios-xcframework"]
description = "Build iOS xcframework artifact"
run = "./scripts/run-build-task.js buildIosXcframework"

[tasks."build:ios-debug-xcframework"]
description = "Build iOS debug xcframework artifact"
run = "./scripts/run-build-task.js buildIosDebugXcframework"

[tasks."build:tray-native"]
description = "Build the Tray GDExtension for the current desktop platform"
run = "node ./scripts/build-tray-native.ts"

[tasks."install:godot-cef"]
description = "Install pinned Godot CEF desktop addon into a Godot project"
depends = ["build:packages"]
usage = '''
arg "<godot_project_dir>" help="Godot project directory to install the addon into"
'''
run = 'pnpm exec kirie doctor --fix plugin:core --project "${usage_godot_project_dir?}"'

[tasks."build:native-artifacts"]
description = "Build Kirie addon native artifacts"
depends = ["build:android-aar", "build:ios-xcframework"]
run = "true"

[tasks."build:packages"]
description = "Build publishable packages"
run = "pnpm run build:packages"

[tasks."check:addon-pack"]
description = "Check staged addon package contents"
run = "./scripts/run-build-task.js checkAddonPack"

[tasks.format]
description = "Format all covered source files"
run = "pnpm run format:eslint && mise run format:kotlin && mise run format:swift && mise run format:rust && mise run format:csharp"

[tasks."format:eslint"]
description = "Format TypeScript, JSON, CSS, and HTML files"
run = "pnpm run format:eslint"

[tasks."format:kotlin"]
description = "Format Kotlin and Gradle Kotlin DSL files"
run = "ktlint --format \"packages/kirie/native/android/**/*.kt\" \"packages/kirie/native/android/**/*.kts\""

[tasks."format:swift"]
description = "Format Swift files"
run = "swiftlint lint --fix --format --no-cache --config .swiftlint.yml"

[tasks."format:rust"]
description = "Format Rust files"
run = "cargo fmt --manifest-path packages/GdKirie.Tray/native/Cargo.toml"

[tasks."format:csharp"]
description = "Format C# files"
run = "dotnet format style -v diag"

[tasks.lint]
description = "Run all linters"
run = "pnpm -C packages/kirie run generate:godot && pnpm -C examples/basic-kirie-cli run generate:godot && pnpm run lint:eslint && mise run lint:kotlin && mise run lint:swift && mise run lint:rust && mise run lint:csharp"

[tasks."lint:eslint"]
description = "Lint TypeScript, JSON, CSS, and HTML files"
run = "pnpm run lint:eslint"

[tasks."lint:kotlin"]
description = "Lint Kotlin and Gradle Kotlin DSL files"
run = "ktlint \"packages/kirie/native/android/**/*.kt\" \"packages/kirie/native/android/**/*.kts\""

[tasks."lint:swift"]
description = "Lint Swift files"
run = "swiftlint lint --strict --no-cache --config .swiftlint.yml"

[tasks."lint:rust"]
description = "Lint Rust files"
run = "cargo clippy --manifest-path packages/GdKirie.Tray/native/Cargo.toml --all-targets --locked -- -D warnings"

[tasks."lint:csharp"]
description = "Lint C# files"
run = "dotnet format analyzers -v diag"

[tasks."pack:nuget"]
description = "Pack the .NET Eventa adapter, Platform, and Tray NuGet packages"
run = [
  "dotnet pack packages/GdKirie.EventaAdapter/GdKirie.EventaAdapter.csproj --configuration Release",
  "dotnet pack packages/GdKirie.Platform/GdKirie.Platform.csproj --configuration Release",
  "dotnet pack packages/GdKirie.Tray/GdKirie.Tray.csproj --configuration Release",
]

[tasks.release]
description = "Run the package release flow"
run = "pnpm run release"

[tasks."run:example"]
description = "Build, install, and launch an example on Android or iOS"
depends = ["build:packages"]
usage = '''
arg "<platform>" help="Target platform" {
  choices "android" "ios"
}
arg "<example_name>" help="Example project name"
arg "[device_id]" help="Optional target device ID; omit for the iOS simulator"
'''
run = './scripts/run-build-task.js runExample "${usage_platform?}" "${usage_example_name?}" "${usage_device_id}"'

[tasks."test:dotnet"]
description = "Run .NET tests"
run = "dotnet test --solution GdKirie.slnx --configuration Release"

[tasks."test:tray-native"]
description = "Run Tray native tests"
run = "cargo test --manifest-path packages/GdKirie.Tray/native/Cargo.toml --locked"

[tasks."test:tray-consumer"]
description = "Test installed Tray packages and a macOS exported application"
depends = ["build:tray-native"]
run = "node ./scripts/test-tray-consumer.ts"

[tasks."test:swift"]
description = "Run Swift unit tests"
run = "pnpm run test:swift"

[tasks."test:integration-android"]
description = "Run the Android platform integration suite"
depends = ["build:packages", "build:integration-web"]
env = { KIRIE_TEST_TARGET = "android" }
run = "pnpm -C tests/integration test"

[tasks."test:integration-ios"]
description = "Run the iOS platform integration suite"
depends = ["build:packages", "build:integration-web"]
env = { KIRIE_TEST_TARGET = "ios" }
run = "pnpm -C tests/integration test"

[tasks."test:integration-desktop"]
description = "Run the desktop Godot CEF platform integration suite"
depends = ["build:packages", "build:integration-web"]
env = { KIRIE_TEST_TARGET = "desktop" }
run = "pnpm -C tests/integration test"

[tasks."test:unit"]
description = "Run package unit tests"
run = "pnpm run test:unit"

[tasks.typecheck]
description = "Typecheck publishable packages"
run = "pnpm run typecheck"
