name: iOS Platform Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    runs-on: xcode-27
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      GODOT_VERSION: 4.7.2
      GODOT_IOS_HEADERS_SHA256: 5e3d897df72fd5cca1979b024380d74f965802fc7388874e57a40d6a48c84610
      GODOT_IOS_SIMULATOR_SHA256: bd354e44bb77d9f887ab42639031fdf7f7edaad16367014e2e0ea6938b6c387d
      MISE_EXEC_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start iPhone 18 Pro simulator (iOS 27.0)
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | jq -er '
            first(.devices["com.apple.CoreSimulator.SimRuntime.iOS-27-0"][]
              | select(.name == "iPhone 18 Pro")) | .udid')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID"

      - name: Install Node, pnpm, and XcodeGen
        uses: jdx/mise-action@v4
        with:
          version: 2026.10.15
          install_args: --locked node pnpm xcodegen
          cache: false

      - name: Install package dependencies
        run: mise x -- pnpm install --frozen-lockfile

      - name: Run Swift unit tests
        run: mise run test:swift

      - name: Install prebuilt Godot headers and simulator library
        run: |
          RELEASE_URL="https://github.com/godot-mobile-plugins/godot-ios-builds/releases/download/$GODOT_VERSION-stable"
          curl --fail --location "$RELEASE_URL/godot-headers-$GODOT_VERSION-stable.zip" -o "$RUNNER_TEMP/headers.zip"
          curl --fail --location "$RELEASE_URL/godot-ios-simulator-debug-$GODOT_VERSION-stable.zip" -o "$RUNNER_TEMP/simulator.zip"
          echo "$GODOT_IOS_HEADERS_SHA256  $RUNNER_TEMP/headers.zip" | shasum -a 256 -c -
          echo "$GODOT_IOS_SIMULATOR_SHA256  $RUNNER_TEMP/simulator.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/headers.zip" -d godot
          unzip -q "$RUNNER_TEMP/simulator.zip" -d "$RUNNER_TEMP/simulator"
          cp -R "$RUNNER_TEMP/simulator/godot-$GODOT_VERSION-stable/bin" godot/bin

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Build iOS simulator XCFramework
        run: mise run build:ios-simulator-xcframework

      - name: Run integration tests
        run: mise run test:integration-ios

      - name: Shut down simulator
        if: always() && env.SIMULATOR_ID != ''
        run: xcrun simctl shutdown "$SIMULATOR_ID"
