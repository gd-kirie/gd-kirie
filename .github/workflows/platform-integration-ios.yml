name: iOS Platform Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GODOT_VERSION: 4.7.2
      MISE_EXEC_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record runner resources
        run: |
          mkdir -p artifacts/ios
          {
            sw_vers
            sysctl hw.logicalcpu hw.memsize vm.swapusage
            vm_stat
            df -h "$GITHUB_WORKSPACE"
          } 2>&1 | tee artifacts/ios/runner-start.log

      - name: Start iPhone 16 Pro simulator (iOS 27.0)
        run: |
          SIMULATOR_ID=$(xcrun simctl create "iPhone 16 Pro" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "Selected simulator: $SIMULATOR_ID"
          /usr/bin/time -l xcrun simctl boot "$SIMULATOR_ID" \
            2>&1 | tee artifacts/ios/simulator-boot.log

      - name: Install Node, pnpm, Python, uv, and XcodeGen
        uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked node pnpm python uv xcodegen
          cache: true

      - name: Install SCons
        run: |
          /usr/bin/time -l mise x -- uv tool install \
            --python "$(mise which python)" scons==4.11.1 \
            2>&1 | tee artifacts/ios/scons-install.log
          mise x -- uv tool dir --bin >> "$GITHUB_PATH"

      - name: Install package dependencies
        run: |
          /usr/bin/time -l mise x -- pnpm install --frozen-lockfile \
            2>&1 | tee artifacts/ios/package-install.log

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Cache Godot iOS export template
        id: ios-export-template-cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable/ios.zip
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-ios-export-template

      - name: Install Godot iOS export template
        if: steps.ios-export-template-cache.outputs.cache-hit != 'true'
        run: |
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          /usr/bin/time -l curl --fail --location \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/export_templates.tpz" \
            2>&1 | tee artifacts/ios/export-template.log
          mkdir -p "$TEMPLATES_DIR"
          /usr/bin/time -l unzip -p "$RUNNER_TEMP/export_templates.tpz" templates/ios.zip \
            > "$TEMPLATES_DIR/ios.zip" 2>> artifacts/ios/export-template.log

      - name: Record toolchain
        id: xcode
        run: |
          XCODE_VERSION=$(xcodebuild -version)
          echo "version=$(echo "$XCODE_VERSION" | tr ' \n' '--')" >> "$GITHUB_OUTPUT"
          {
            echo "$XCODE_VERSION"
            xcode-select -p
            mise x -- godot --version
            mise x -- node --version
            mise x -- pnpm --version
            mise x -- python --version
            mise x -- uv --version
            mise x -- xcodegen --version
            mise x -- scons --version
          } 2>&1 | tee artifacts/ios/toolchain.log

      - name: Download Godot source
        run: |
          mkdir -p godot
          /usr/bin/time -l curl --fail --location \
            "https://github.com/godotengine/godot/archive/refs/tags/${GODOT_VERSION}-stable.tar.gz" \
            -o "$RUNNER_TEMP/godot.tar.gz" \
            2>&1 | tee artifacts/ios/godot-source.log
          /usr/bin/time -l tar -xzf "$RUNNER_TEMP/godot.tar.gz" --strip-components=1 -C godot \
            2>&1 | tee -a artifacts/ios/godot-source.log

      - name: Generate Godot source headers
        working-directory: godot
        run: |
          /usr/bin/time -l mise x -- scons platform=macos target=editor \
            vulkan=no \
            core/version_generated.gen.h \
            core/disabled_classes.gen.h \
            core/extension/gdextension_interface.gen.h \
            core/object/gdvirtual.gen.h \
            2>&1 | tee ../artifacts/ios/godot-headers.log

      - name: Cache Godot iOS simulator template
        id: template-cache
        uses: actions/cache@v5
        with:
          path: godot/bin/libgodot.ios.template_debug.arm64.simulator.a
          key: ${{ runner.os }}-${{ runner.arch }}-godot-${{ env.GODOT_VERSION }}-${{ steps.xcode.outputs.version }}-ios-template_debug-arm64-simulator

      - name: Build Godot iOS simulator template
        if: steps.template-cache.outputs.cache-hit != 'true'
        working-directory: godot
        run: |
          /usr/bin/time -l mise x -- scons platform=ios target=template_debug arch=arm64 simulator=yes \
            -j"$(sysctl -n hw.logicalcpu)" \
            2>&1 | tee ../artifacts/ios/godot-simulator-template.log

      - name: Build iOS debug XCFramework
        env:
          KIRIE_IOS_SIMULATOR_ARCHS: arm64
        run: |
          /usr/bin/time -l mise run build:ios-debug-xcframework \
            2>&1 | tee artifacts/ios/kirie-xcframework.log

      - name: Build integration prerequisites
        run: |
          /usr/bin/time -l mise run build:integration \
            2>&1 | tee artifacts/ios/integration-build.log

      - name: Wait for simulator
        timeout-minutes: 5
        run: |
          /usr/bin/time -l xcrun simctl bootstatus "$SIMULATOR_ID" -b \
            2>&1 | tee -a artifacts/ios/simulator-boot.log

      - name: Run integration tests
        timeout-minutes: 15
        run: |
          /usr/bin/time -l mise run --skip-deps test:integration-ios \
            2>&1 | tee artifacts/ios/integration.log

      - name: Record final runner resources
        if: always()
        run: |
          {
            sysctl vm.swapusage
            vm_stat
            df -h "$GITHUB_WORKSPACE"
          } 2>&1 | tee artifacts/ios/runner-end.log

      - name: Collect simulator engine log
        if: always() && env.SIMULATOR_ID != ''
        run: |
          APP=tests/integration/dist/kirie/ios/debug.app
          if [[ -f "$APP/Info.plist" ]]; then
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
            CONTAINER=$(xcrun simctl get_app_container "$SIMULATOR_ID" "$BUNDLE_ID" data)
            if [[ -f "$CONTAINER/tmp/kirie.log" ]]; then
              cp "$CONTAINER/tmp/kirie.log" artifacts/ios/engine.log
            fi
          fi

      - name: Upload iOS logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-integration-logs
          path: artifacts/ios
