name: iOS Platform Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GODOT_VERSION: 4.7.2
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      MISE_EXEC_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node, pnpm, and XcodeGen
        uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked node pnpm xcodegen
          cache: true

      - name: Start an available iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | mise x -- node -e '
            const fs = require("node:fs");
            const { devices } = JSON.parse(fs.readFileSync(0, "utf8"));
            const iphone = Object.values(devices).flat().find(device => device.name.startsWith("iPhone"));
            if (!iphone) throw new Error("No available iPhone simulator");
            process.stdout.write(iphone.udid);
          ')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "Selected simulator: $SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Cache Godot iOS export template
        id: ios-export-template-cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable/ios.zip
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-ios-export-template

      - name: Install Godot iOS export template
        if: steps.ios-export-template-cache.outputs.cache-hit != 'true'
        run: |
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          curl --fail --location \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/export_templates.tpz"
          mkdir -p "$TEMPLATES_DIR"
          unzip -p "$RUNNER_TEMP/export_templates.tpz" templates/ios.zip > "$TEMPLATES_DIR/ios.zip"

      - name: Record Xcode version
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr ' \n' '--')" >> "$GITHUB_OUTPUT"

      - name: Install SCons and package dependencies
        run: |
          brew install scons
          mise x -- pnpm install --frozen-lockfile

      - name: Prepare Godot source headers
        run: |
          mkdir -p godot
          curl --fail --location "https://github.com/godotengine/godot/archive/refs/tags/${GODOT_VERSION}-stable.tar.gz" \
            | tar -xz --strip-components=1 -C godot
          cd godot
          mise x -- scons platform=macos target=editor \
            vulkan=no \
            core/version_generated.gen.h \
            core/disabled_classes.gen.h \
            core/extension/gdextension_interface.gen.h \
            core/object/gdvirtual.gen.h

      - name: Cache Godot iOS simulator template
        id: template-cache
        uses: actions/cache@v5
        with:
          path: godot/bin/libgodot.ios.template_debug.arm64.simulator.a
          key: ${{ runner.os }}-${{ runner.arch }}-godot-${{ env.GODOT_VERSION }}-${{ steps.xcode.outputs.version }}-ios-template_debug-arm64-simulator

      - name: Build Godot iOS simulator template
        if: steps.template-cache.outputs.cache-hit != 'true'
        working-directory: godot
        run: |
          mise x -- scons platform=ios target=template_debug arch=arm64 simulator=yes \
            -j"$(sysctl -n hw.logicalcpu)"

      - name: Build iOS debug XCFramework
        env:
          KIRIE_IOS_SIMULATOR_ARCHS: arm64
        run: mise run build:ios-debug-xcframework

      - name: Wait for simulator
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Run integration tests
        timeout-minutes: 15
        run: |
          mkdir -p artifacts/ios
          mise run test:integration-ios 2>&1 | tee artifacts/ios/integration.log

      - name: Collect simulator engine log
        if: always() && env.SIMULATOR_ID != ''
        run: |
          APP=tests/integration/dist/kirie/ios/debug.app
          if [[ -f "$APP/Info.plist" ]]; then
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
            CONTAINER=$(xcrun simctl get_app_container "$SIMULATOR_ID" "$BUNDLE_ID" data)
            if [[ -f "$CONTAINER/tmp/kirie.log" ]]; then
              cp "$CONTAINER/tmp/kirie.log" artifacts/ios/engine.log
            fi
          fi

      - name: Upload iOS logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-integration-logs
          path: artifacts/ios
