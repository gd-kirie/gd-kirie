name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      MISE_EXEC_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install libxml2 for swiftlint (Ubuntu 26.04)
        run: |
          # Ubuntu 26.04 ships libxml2.so.16 (package libxml2-16); swiftlint still needs libxml2.so.2.
          sudo apt-get update
          sudo apt-get install -y libxml2-16
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          if [ ! -e "/usr/lib/${multiarch}/libxml2.so.2" ]; then
            libxml2="$(find "/usr/lib/${multiarch}" -maxdepth 1 -name 'libxml2.so.*' ! -name 'libxml2.so' | sort | tail -1)"
            sudo ln -sf "$libxml2" "/usr/lib/${multiarch}/libxml2.so.2"
          fi

      - name: Install lint tools
        uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked node pnpm python uv java ktlint swiftlint dotnet
          cache: true

      - name: Repair empty NuGet configuration
        run: test -s "$HOME/.nuget/NuGet/NuGet.Config" || mise x -- dotnet new nugetconfig --force --output "$HOME/.nuget/NuGet"

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(mise x -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies
        run: mise x -- pnpm install --frozen-lockfile

      - name: Run lint
        run: |
          mise run lint
          git diff --exit-code

  format:
    name: Format
    runs-on: ubuntu-latest
    env:
      MISE_EXEC_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install libxml2 for swiftlint (Ubuntu 26.04)
        run: |
          # Ubuntu 26.04 ships libxml2.so.16 (package libxml2-16); swiftlint still needs libxml2.so.2.
          sudo apt-get update
          sudo apt-get install -y libxml2-16
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          if [ ! -e "/usr/lib/${multiarch}/libxml2.so.2" ]; then
            libxml2="$(find "/usr/lib/${multiarch}" -maxdepth 1 -name 'libxml2.so.*' ! -name 'libxml2.so' | sort | tail -1)"
            sudo ln -sf "$libxml2" "/usr/lib/${multiarch}/libxml2.so.2"
          fi

      - name: Install format tools
        uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked node pnpm python uv java ktlint swiftlint dotnet
          cache: true

      - name: Repair empty NuGet configuration
        run: test -s "$HOME/.nuget/NuGet/NuGet.Config" || mise x -- dotnet new nugetconfig --force --output "$HOME/.nuget/NuGet"

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(mise x -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies
        run: mise x -- pnpm install --frozen-lockfile

      - name: Check format
        run: |
          mise run format
          git diff --exit-code

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      MISE_EXEC_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node and pnpm
        uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked node pnpm
          cache: true

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(mise x -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies
        run: mise x -- pnpm install --frozen-lockfile

      - name: Run typecheck
        run: mise run typecheck
