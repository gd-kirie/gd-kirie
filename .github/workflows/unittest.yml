name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      MISE_EXEC_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node, pnpm, and .NET
        uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked node pnpm dotnet
          cache: true

      - name: Repair empty NuGet configuration
        run: test -s "$HOME/.nuget/NuGet/NuGet.Config" || mise x -- dotnet new nugetconfig --force --output "$HOME/.nuget/NuGet"

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(mise x -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies
        run: mise x -- pnpm install --frozen-lockfile

      - name: Run unit tests
        run: mise run test:unit

  dotnet-unit-tests:
    name: .NET tests
    runs-on: ubuntu-latest
    env:
      MISE_EXEC_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET
        uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked dotnet
          cache: true

      - name: Repair empty NuGet configuration
        run: test -s "$HOME/.nuget/NuGet/NuGet.Config" || mise x -- dotnet new nugetconfig --force --output "$HOME/.nuget/NuGet"

      - name: Run .NET tests
        run: mise run test:dotnet

  tray-native-unit-tests:
    name: Tray native tests
    runs-on: ubuntu-latest
    env:
      MISE_EXEC_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked rust
          cache: true

      - name: Run Tray native tests
        run: mise run test:tray-native

  swift-unit-tests:
    name: Swift unit tests
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      MISE_EXEC_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node and pnpm
        uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked node pnpm
          cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(mise x -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install pnpm dependencies
        run: mise x -- pnpm install --frozen-lockfile

      - name: Run Swift unit tests
        timeout-minutes: 10
        run: mise run test:swift
