name: Publish NuGet Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tray-native:
    name: Tray native (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025
          - windows-11-arm
    env:
      MISE_EXEC_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node and Rust
        uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked node rust
          cache: true

      - name: Build Tray native library
        run: mise run build:tray-native

      - name: Upload Tray native library
        uses: actions/upload-artifact@v7
        with:
          name: tray-native-${{ matrix.runner }}
          path: packages/GdKirie.Tray/native/artifacts
          if-no-files-found: error

  packages:
    name: Publish NuGet Packages
    runs-on: ubuntu-latest
    needs: tray-native
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must point to a commit on main."
            exit 1
          fi

      - name: Install mise
        uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked dotnet
          cache: true

      - name: Repair empty NuGet configuration
        run: test -s "$HOME/.nuget/NuGet/NuGet.Config" || mise x -- dotnet new nugetconfig --force --output "$HOME/.nuget/NuGet"

      - name: Download Tray native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: tray-native-*
          path: packages/GdKirie.Tray/native/artifacts
          merge-multiple: true

      - name: Verify Tray native libraries
        run: |
          for asset in \
            linux-x64/libkirie_tray_native.so \
            linux-arm64/libkirie_tray_native.so \
            osx-x64/libkirie_tray_native.dylib \
            osx-arm64/libkirie_tray_native.dylib \
            win-x64/kirie_tray_native.dll \
            win-arm64/kirie_tray_native.dll; do
            test -f "packages/GdKirie.Tray/native/artifacts/${asset}"
          done

      - name: Restore dependencies
        run: mise x -- dotnet restore GdKirie.slnx

      - name: Build release
        run: mise x -- dotnet build GdKirie.slnx --configuration Release

      - name: Run tests
        run: mise x -- dotnet test --solution GdKirie.slnx --configuration Release --no-build

      - name: Pack NuGet packages
        run: >-
          mise x -- dotnet pack GdKirie.slnx --configuration Release --no-build
          --disable-build-servers -m:1 --output artifacts/nuget

      - name: Validate Trusted Publishing configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [[ -z "${NUGET_USER}" ]]; then
            echo "::error::NUGET_USER must be configured as a repository Actions variable."
            exit 1
          fi

      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          mise x -- dotnet nuget push "artifacts/nuget/*.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
