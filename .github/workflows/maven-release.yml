name: Publish Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: Publish Maven Central
    runs-on: ubuntu-latest
    env:
      MISE_EXEC_AUTO_INSTALL: "false"
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must point to a commit on main."
            exit 1
          fi

      - name: Install Java
        uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked java
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Validate Maven Central secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=0
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD SIGNING_KEY SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository secret ${name} must be configured for Maven Central publishing."
              missing=1
            fi
          done
          exit "${missing}"

      # Central Publisher Portal (OSSRH is shut down). Uploads a signed bundle
      # (AAR, sources, javadoc, POM, .asc) and releases it automatically.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >-
          packages/kirie/native/android/gradlew
          --project-dir packages/kirie/native/android
          --no-configuration-cache
          :plugin:publishAndReleaseToMavenCentral
